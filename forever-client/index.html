<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forever Bolivia | Panel Administrativo</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">

    <style>
        /* Configuración global para que todo el sistema use la fuente elegante */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa; /* Gris muy suave para que resalten las tarjetas blancas */
            margin: 0;
            padding: 0;
        }

        /* Ocultar la barra de scroll pero permitir el movimiento (Para que se vea limpio) */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Animación para que el globito dorado de notificaciones llame la atención */
        .animate-pulse-soft {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .8; }
        }
    </style>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        forever: {
                            green: '#4a5d23',
                            gold: '#b48a2d',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="antialiased text-[#1a1a1a]">

    <div id="app"></div>

    <script type="module" src="/src/main.js"></script>

</body>
</html>
